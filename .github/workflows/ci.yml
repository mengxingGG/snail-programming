name: CI

on:
  push:
    branches: [master, main]
  pull_request:

# 同一分支上新的推送会取消仍在跑的旧任务
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 类型检查 / Lint / 测试 / 构建
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 代码执行器会调用本机 node 与 python，两个平台都要覆盖
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: 单元测试
        run: npm test

      - name: 生产构建
        run: npm run build

  audit:
    name: 依赖漏洞扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 生产依赖不允许存在未经评估的 high/critical 漏洞
      # 已评估豁免项见 scripts/audit-gate.mjs
      - name: 扫描生产依赖
        run: npm run audit:prod
